name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  # The reusable workflow logs in to GHCR before GoReleaser, so the job needs
  # packages read. This config builds no image.
  release:
    name: Release
    permissions:
      contents: write
      packages: read
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@27761db3a195bf97dcbc0727fdf1fb311c91cb06 # v2.0.35
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # The attestation holds the sha256 of each archive in checksums.txt of the
  # release. Check an archive with gh attestation verify <file> --repo USA-RedDragon/docgen.
  provenance:
    name: Provenance
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$REPO" --pattern checksums.txt --dir "$RUNNER_TEMP"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/checksums.txt

  # The playground of the docs site: the Go toolchain, docgen.wasm and the page
  # of this tag, in one archive on the release. The Cloudflare build serves the
  # archive of the latest release at /playground/. GoReleaser makes the release
  # first, so this job only adds files to it.
  playground:
    name: Playground
    needs: release
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the playground
        env:
          PLAYGROUND_VERSION: ${{ github.ref_name }}
          PLAYGROUND_WORK: ${{ runner.temp }}/playground-work
        run: playground/build/build.sh all "$RUNNER_TEMP/dist/playground"

      - name: Make the archive and its checksum file
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="docgen_${TAG#v}_playground"
          cd "$RUNNER_TEMP/dist"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$name.tar" playground
          sha256sum "$name.tar" >"${name}_checksums.txt"
          cat "${name}_checksums.txt"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/${{ steps.archive.outputs.name }}.tar

      - name: Add the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.archive.outputs.name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/dist/$NAME.tar" "$RUNNER_TEMP/dist/${NAME}_checksums.txt" --repo "$REPO" --clobber
