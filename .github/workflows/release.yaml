name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  # The reusable workflow logs in to GHCR before GoReleaser, so the job needs
  # packages read. This config builds no image.
  release:
    name: Release
    permissions:
      contents: write
      packages: read
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@27761db3a195bf97dcbc0727fdf1fb311c91cb06 # v2.0.35
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  # The attestation holds the sha256 of each archive in checksums.txt of the
  # release. Check an archive with gh attestation verify <file> --repo USA-RedDragon/docgen.
  provenance:
    name: Provenance
    needs: release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the checksums
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release download "$TAG" --repo "$REPO" --pattern checksums.txt --dir "$RUNNER_TEMP"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/checksums.txt

  # The playground of the docs site: the Go toolchain, docgen.wasm and the page
  # of this tag, in one archive on the release. The Cloudflare build serves the
  # archive of the newest release that has one at /playground/. This job runs
  # the build, with npm packages and Go modules, so it has a read-only token
  # and hands the archive to the next job as a workflow artifact.
  playground-build:
    name: Playground build
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the playground
        env:
          PLAYGROUND_VERSION: ${{ github.ref_name }}
          PLAYGROUND_WORK: ${{ runner.temp }}/playground-work
        run: playground/build/build.sh all "$RUNNER_TEMP/dist/playground"

      - name: Make the archive and its checksum file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="docgen_${TAG#v}_playground"
          cd "$RUNNER_TEMP/dist"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$name.tar" playground
          sha256sum "$name.tar" >"${name}_checksums.txt"
          cat "${name}_checksums.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground
          path: |
            ${{ runner.temp }}/dist/*.tar
            ${{ runner.temp }}/dist/*_checksums.txt
          if-no-files-found: error
          retention-days: 7

  # GoReleaser makes the release first, so this job only adds files to it. It
  # runs no code of the repository.
  playground:
    name: Playground upload
    needs: [release, playground-build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: playground
          path: ${{ runner.temp }}/dist

      - name: Check the archive
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="docgen_${TAG#v}_playground"
          cd "$RUNNER_TEMP/dist"
          sha256sum -c "${name}_checksums.txt"
          echo "name=$name" >>"$GITHUB_OUTPUT"

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/${{ steps.archive.outputs.name }}.tar

      - name: Add the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ steps.archive.outputs.name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/dist/$NAME.tar" "$RUNNER_TEMP/dist/${NAME}_checksums.txt" --repo "$REPO" --clobber

  # Cloudflare Pages builds on a push to a branch, not on a tag. After the
  # playground archive is on the release, the deploy hook builds main again, so
  # /latest/ and /playground/ show the new tag. A failed playground job still
  # leaves the docs of the tag. The hook URL is the only credential, and it can
  # start a build of main and nothing else.
  rebuild:
    name: Rebuild the docs site
    needs: [release, playground]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-26.04
    permissions: {}

    steps:
      - name: Start a Cloudflare build of main
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No CLOUDFLARE_DEPLOY_HOOK secret, so /latest/ shows the new tag after the next build of main."
            exit 0
          fi
          case $HOOK in
          https://api.cloudflare.com/client/v4/pages/webhooks/deploy_hooks/*) ;;
          *) echo "::error::CLOUDFLARE_DEPLOY_HOOK must be a Cloudflare Pages deploy hook URL on api.cloudflare.com."; exit 1 ;;
          esac
          curl -fsS -m 30 -X POST -o /dev/null "$HOOK"
          echo "::notice::Started a Cloudflare build of main."
