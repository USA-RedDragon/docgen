name: Docs

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A tag push also rebuilds /main/, so it needs the main branch.
          ref: ${{ github.ref_type == 'tag' && 'main' || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the generated parts of the docs
        run: go run . check

      - name: Install pandoc
        run: docs/site/install-pandoc.sh "$RUNNER_TEMP/pandoc" >>"$GITHUB_PATH"

      - name: Test the site scripts
        run: go test ./internal/sitetest

      - name: Build the docs site
        if: github.event_name == 'pull_request'
        run: docs/site/build.sh

      - name: Build all versions of the docs site
        if: github.event_name == 'push'
        run: docs/site/build.sh --versions

  # GitHub Pages serves only a redirect, so links to the old address
  # https://usa-reddragon.github.io/docgen/ keep working.
  redirect:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-26.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: docs-pages
      cancel-in-progress: false

    steps:
      # Until the custom domain serves the site, GitHub Pages keeps the old
      # copy of the docs, so no link ends at a page that is not there.
      - name: Check the new domain
        id: domain
        run: |
          if curl -fsS -m 30 https://docgen.mcswain.dev/versions.json | jq -e '.latest' >/dev/null; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::https://docgen.mcswain.dev/ does not serve the docs yet, so GitHub Pages keeps the old site. Add the domain to the docgen Worker."
          fi

      - name: Checkout repository
        if: steps.domain.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/site/redirect.html
          sparse-checkout-cone-mode: false

      - name: Make the redirect site
        if: steps.domain.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/redirect"
          cp docs/site/redirect.html "$RUNNER_TEMP/redirect/index.html"
          cp docs/site/redirect.html "$RUNNER_TEMP/redirect/404.html"

      - name: Upload the redirect site
        if: steps.domain.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/redirect

      - name: Deploy the redirect site
        if: steps.domain.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
