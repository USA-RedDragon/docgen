# This workflow deploys the site that the Docs preview workflow built for a
# pull request to Cloudflare Pages, and links it in a comment.
#
# A workflow_run workflow runs from the default branch with the secrets of the
# repository, also for a fork pull request. So it runs no code of the pull
# request: no checkout, and no script or config from the artifact. The artifact
# is data that the pull request controls. The steps check the number, the file
# types, the size and the commit before the deploy, and pass each value through
# env, never through an expression in a script.
name: Docs preview deploy

on:
  workflow_run:
    workflows: [Docs preview]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

concurrency:
  group: docs-preview-deploy @ ${{ github.event.workflow_run.head_repository.full_name }} @ ${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-26.04

    steps:
      # Until the owner adds the secret, the job ends here with a notice, so the
      # repository works before Cloudflare is set up.
      - name: Check the Cloudflare settings
        id: settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'docgen' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No docs preview: set the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable to deploy one."
            exit 0
          fi
          case $PROJECT in
          '' | -* | *[!a-z0-9-]*)
            echo "::error::CLOUDFLARE_PAGES_PROJECT '$PROJECT' must be lowercase letters, digits and dashes."
            exit 1
            ;;
          esac
          echo "project=$PROJECT" >>"$GITHUB_OUTPUT"

      - name: Download the docs site
        if: steps.settings.outputs.project != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview
          path: ${{ runner.temp }}/preview
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      # A pull request can put any files in the artifact. Cloudflare Pages runs
      # _worker.js as code and reads _headers, _redirects and _routes.json, so
      # the site may hold no top-level name that starts with _. The number must
      # be of an open pull request whose head is the commit of the build, so a
      # build cannot deploy to the preview of another pull request.
      - name: Check the docs site
        id: check
        if: steps.settings.outputs.project != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MAX_BYTES: '52428800'
          MAX_FILES: '2000'
        run: |
          dir=$RUNNER_TEMP/preview
          fail() {
            echo "::error::The docs preview artifact is not valid: $1"
            exit 1
          }
          [ -d "$dir" ] || fail "it is not a directory"
          if [ -n "$(find "$dir" ! -type f ! -type d -print -quit)" ]; then
            fail "it holds an entry that is not a regular file or a directory"
          fi
          for entry in "$dir"/* "$dir"/.[!.]* "$dir"/..?*; do
            [ -e "$entry" ] || continue
            case ${entry#"$dir"/} in
            pr-number | site) ;;
            *) fail "it holds ${entry#"$dir"/}; it must hold pr-number and site only" ;;
            esac
          done
          [ -f "$dir/pr-number" ] || fail "pr-number is not a file"
          [ -d "$dir/site" ] || fail "site is not a directory"
          [ -f "$dir/site/index.html" ] || fail "site/index.html is missing"
          if [ -n "$(find "$dir/site" -mindepth 1 -maxdepth 1 -name '_*' -print -quit)" ]; then
            fail "site holds a top-level name that starts with _"
          fi
          bytes=$(du -sb "$dir" | cut -f 1)
          [ "$bytes" -le "$MAX_BYTES" ] || fail "it is $bytes bytes; the limit is $MAX_BYTES"
          files=$(find "$dir" -type f | wc -l)
          [ "$files" -le "$MAX_FILES" ] || fail "it holds $files files; the limit is $MAX_FILES"
          [ "$(wc -c <"$dir/pr-number")" -le 12 ] || fail "pr-number is too long"
          pr=$(tr -d '\n' <"$dir/pr-number")
          case $pr in
          '' | 0* | *[!0-9]*) fail "pr-number is not a number" ;;
          esac
          state=$(gh api "repos/$REPO/pulls/$pr" --jq '.state + " " + .head.sha') || fail "pull request $pr was not found"
          if [ "$state" != "open $HEAD_SHA" ]; then
            echo "::notice::No docs preview: pull request $pr is not open at commit $HEAD_SHA."
            exit 0
          fi
          echo "pr=$pr" >>"$GITHUB_OUTPUT"

      # The SHA is the commit of the v4.1.3 tag. The tag ref points to a tag
      # object, so the SHA comes from gh api repos/cloudflare/wrangler-action/git/tags/<sha>.
      # The working directory is the empty workspace, so wrangler reads no
      # config and installs no package from the artifact.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.check.outputs.pr != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/preview/site --project-name=${{ steps.settings.outputs.project }} --branch=pr-${{ steps.check.outputs.pr }}

      - name: Comment on the pull request
        if: steps.check.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.check.outputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          url=${ALIAS_URL:-$DEPLOYMENT_URL}
          case $url in
          https://*) ;;
          *) url= ;;
          esac
          case ${url#https://} in
          '' | *[!A-Za-z0-9./:-]*)
            echo "::error::wrangler gave no deployment URL."
            exit 1
            ;;
          esac
          tag='<!-- docgen-preview -->'
          body=$RUNNER_TEMP/preview-comment.md
          printf '%s\n**Docs preview**: %s\n\nBuilt from %s.\n' "$tag" "$url" "$HEAD_SHA" >"$body"
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | startswith(\"$tag\")) | .id" >"$RUNNER_TEMP/preview-comment.ids"
          id=$(head -n 1 "$RUNNER_TEMP/preview-comment.ids")
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" --silent
            echo "Updated comment $id."
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" --silent
            echo "Posted a comment."
          fi
