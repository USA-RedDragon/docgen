# This workflow builds the docs site of a pull request, and the Docs preview
# deploy workflow puts it on Cloudflare Pages. This workflow runs the code of
# the pull request, so it gets no secrets and a read-only token. GitHub asks
# for approval before it runs for a fork pull request, by the settings of the
# repository. Do not add secrets or write permissions here.
name: Docs preview

on: pull_request

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    env:
      PANDOC_VERSION: "3.13"
      PANDOC_SHA256: 38aa33b325a2bc96a4c39409631212db55702f564250bcdbead180b3bf646389

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install pandoc
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.tar.gz" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/pandoc.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"

      # The preview shows the pages as docgen update writes them, so a stale
      # page still gets a preview.
      - name: Update the docs
        run: go run . update

      # The deploy workflow gets no pull request context from workflow_run, so
      # the number goes in the artifact. The deploy workflow does not trust it:
      # it checks the number against the pull request of the commit.
      - name: Build the docs site
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          docs/site/build.sh "$RUNNER_TEMP/preview/site"
          printf '%s\n' "$PR_NUMBER" >"$RUNNER_TEMP/preview/pr-number"

      - name: Upload the docs site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview
          path: ${{ runner.temp }}/preview
          if-no-files-found: error
          retention-days: 7
