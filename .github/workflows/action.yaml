name: Action

on: pull_request

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # A fake gh serves the release archives, so the test needs no release.
      - name: Test the install script
        run: action/test.sh

  action:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the docs with the action
        uses: ./

      - name: Update the docs with the action
        uses: ./
        with:
          command: update

      - name: Check that update changed nothing
        run: git diff --exit-code

      - name: Make a page stale
        run: sed -i 's/`1\.[0-9.]*`<!-- \/docgen:gomod -->/`0.0.0`<!-- \/docgen:gomod -->/' README.md

      - name: Check the stale page with the action
        id: stale
        continue-on-error: true
        uses: ./

      - name: Check that the action failed
        env:
          OUTCOME: ${{ steps.stale.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::the check of a stale page has outcome $OUTCOME; want failure"
            exit 1
          fi

      # The token of this workflow cannot write, as on a fork pull request, so
      # the log shows a warning and the outcome stays that of docgen.
      - name: Check the stale page with a comment
        id: comment
        continue-on-error: true
        uses: ./
        with:
          comment: true

      - name: Check that the action with a comment failed
        env:
          OUTCOME: ${{ steps.comment.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::the check of a stale page with a comment has outcome $OUTCOME; want failure"
            exit 1
          fi
