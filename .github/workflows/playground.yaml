name: Playground

# A pull request that changes the playground or docgen builds all of it, as the
# release workflow does on a tag, and runs the browser test in headless
# Firefox. It uploads nothing to a release. A pull request can restore only
# the caches of its own runs and of main, so a manual run on main fills the
# wasm-opt cache for all pull requests.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'playground/**'
      - '*.go'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/site/build.sh'
      - 'docs/site/cloudflare.sh'
      - '.github/workflows/playground.yaml'
      - '.github/workflows/release.yaml'

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: true

jobs:
  playground:
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The wasm-opt outputs, by the SHA-256 of their inputs. Without a change
      # of a tool, the build takes no wasm-opt time.
      - name: Restore the wasm-opt outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playground-work/opt-cache
          key: playground-opt-${{ hashFiles('go.mod', 'playground/bb/**', 'playground/unzstd/**', 'playground/overlay/**', 'playground/build/mkoverlay.py', 'playground/build/package-lock.json') }}
          restore-keys: playground-opt-

      - name: Build the playground
        env:
          PLAYGROUND_VERSION: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}
          PLAYGROUND_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PLAYGROUND_WORK: ${{ runner.temp }}/playground-work
        run: playground/build/build.sh all "$RUNNER_TEMP/playground"

      - name: Install pandoc
        run: docs/site/install-pandoc.sh "$RUNNER_TEMP/pandoc" >>"$GITHUB_PATH"

      - name: Build the docs site with the playground
        run: |
          docs/site/build.sh
          cp -R "$RUNNER_TEMP/playground" artifacts/docs-site/playground

      - name: Check for Firefox
        run: |
          if ! command -v firefox >/dev/null; then
            echo "::error::The runner image has no firefox."
            exit 1
          fi
          firefox --version

      - name: Test the playground in headless Firefox
        env:
          DOCS: /index.html playground/
        run: playground/test/run.sh artifacts/docs-site "$RUNNER_TEMP/playground-test"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playground-test
          path: ${{ runner.temp }}/playground-test
          if-no-files-found: ignore
          retention-days: 14
