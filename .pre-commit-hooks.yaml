- id: docgen-check
  name: docgen check
  description: Fail when a docgen marker, region, diagram, variable or link is stale, unused or broken.
  entry: docgen check
  language: golang
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
  minimum_pre_commit_version: '3.2.0'

- id: docgen-update
  name: docgen update
  description: Fill the docgen markers of the Markdown pages.
  entry: docgen update
  language: golang
  pass_filenames: false
  always_run: true
  stages: [manual]
  minimum_pre_commit_version: '3.2.0'

# These two hooks run the docgen on PATH, so a repository with no Go, such as
# a Rust-only one, needs no Go toolchain. Install a release archive instead.
- id: docgen-check-system
  name: docgen check
  description: Like docgen-check, but runs the docgen on PATH, so the repository needs no Go.
  entry: docgen check
  language: system
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-merge-commit, pre-push, manual]
  minimum_pre_commit_version: '3.2.0'

- id: docgen-update-system
  name: docgen update
  description: Like docgen-update, but runs the docgen on PATH, so the repository needs no Go.
  entry: docgen update
  language: system
  pass_filenames: false
  always_run: true
  stages: [manual]
  minimum_pre_commit_version: '3.2.0'
