<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>docgen docs moved</title>
<link rel="canonical" href="https://docgen.mcswain.dev/">
<noscript><meta http-equiv="refresh" content="0; url=https://docgen.mcswain.dev/"></noscript>
<script>
// The GitHub Pages site of this repository lives under /docgen/. The same
// path, query and fragment on the new host give the same page.
var path = location.pathname.replace(/^\/docgen(\/|$)/, "/");
location.replace("https://docgen.mcswain.dev" + path + location.search + location.hash);
</script>
</head>
<body>
<p>The docgen docs moved to <a href="https://docgen.mcswain.dev/">docgen.mcswain.dev</a>.</p>
</body>
