[workspace]
resolver = "3"
members = ["crates/cargo-b-cli", "crates/cargo-b-core", "crates/core-a", "crates/core-a-bin", "crates/err-store", "crates/feat-gate", "crates/limits", "crates/run-c", "crates/run-c-broken", "crates/tool"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Docgen Fixture"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
limits = { path = "crates/limits" }
