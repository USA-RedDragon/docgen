name: docgen
description: Check or fill the docgen markers of the Markdown pages of a repository.
author: USA-RedDragon

branding:
  icon: book-open
  color: blue

inputs:
  command:
    description: check or update.
    required: false
    default: check
  directory:
    description: The directory to scan, relative to the working directory. Empty uses the docs setting of .docgen.yaml.
    required: false
    default: ''
  module:
    description: The directory of the Go module, relative to the repository root. Empty uses the module setting.
    required: false
    default: ''
  tags:
    description: Comma-separated build tags. Empty uses the tags setting.
    required: false
    default: ''
  jobs:
    description: The -p of each go command. Empty uses the jobs setting.
    required: false
    default: ''
  diff:
    description: With check, print a unified diff of each stale page and generated file. update ignores it.
    required: false
    default: 'true'
  version:
    description: A docgen version, such as v0.1.0 or latest. A release tag downloads the release binary, and another version installs with go install. Empty uses the ref of the action.
    required: false
    default: ''
  comment:
    description: With check on a pull_request event, post or update one comment on the pull request with the result. The job needs pull-requests write.
    required: false
    default: 'false'
  token:
    description: The token for the release download and the comment.
    required: false
    default: ${{ github.token }}
  marker:
    description: The name in the hidden HTML comment that marks the comment. Letters, digits, dot, dash and underscore only.
    required: false
    default: docgen-check

runs:
  using: composite
  steps:
    # github.action_ref and github.action_repository go through env, because
    # they are empty in a run script of a composite action.
    - name: Find docgen
      id: find
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        case $INPUT_COMMAND in
        check | update) ;;
        *)
          echo "::error::command is '$INPUT_COMMAND'; it must be check or update."
          exit 1
          ;;
        esac
        "$ACTION_PATH/action/install.sh" resolve

    - name: Restore the docgen build
      id: restore
      if: steps.find.outputs.mode == 'build'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.find.outputs.dir }}
        key: ${{ steps.find.outputs.key }}

    - name: Install docgen
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.token }}
        MODE: ${{ steps.find.outputs.mode }}
        VERSION: ${{ steps.find.outputs.version }}
        FALLBACK: ${{ steps.find.outputs.fallback }}
        DIR: ${{ steps.find.outputs.dir }}
      run: '"$ACTION_PATH/action/install.sh" install'

    - name: Save the docgen build
      if: steps.find.outputs.mode == 'build' && steps.install.outputs.built == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.find.outputs.dir }}
        key: ${{ steps.find.outputs.key }}

    - name: Run docgen
      id: docgen
      shell: bash
      env:
        BIN: ${{ steps.install.outputs.bin }}
        INPUT_COMMENT: ${{ inputs.comment }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_MODULE: ${{ inputs.module }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_JOBS: ${{ inputs.jobs }}
        INPUT_DIFF: ${{ inputs.diff }}
      run: |
        args=("$INPUT_COMMAND")
        if [ -n "$INPUT_MODULE" ]; then args+=(-module "$INPUT_MODULE"); fi
        if [ -n "$INPUT_TAGS" ]; then args+=(-tags "$INPUT_TAGS"); fi
        if [ -n "$INPUT_JOBS" ]; then args+=(-jobs "$INPUT_JOBS"); fi
        if [ "$INPUT_COMMAND" = check ] && [ "$INPUT_DIFF" = true ]; then args+=(-diff); fi
        if [ -n "$INPUT_DIRECTORY" ]; then args+=("$INPUT_DIRECTORY"); fi
        if [ "$INPUT_COMMENT" != true ] || [ "$INPUT_COMMAND" != check ] || [ "$EVENT_NAME" != pull_request ]; then
          exec "$BIN" "${args[@]}"
        fi
        result=$(mktemp -d "$RUNNER_TEMP/docgen-result.XXXXXX")
        echo "result=$result" >>"$GITHUB_OUTPUT"
        set +e
        { "$BIN" "${args[@]}" 2>&1 1>&3 3>&- | tee "$result/stderr" >&2; } 3>"$result/stdout"
        rc=${PIPESTATUS[0]}
        set -e
        cat "$result/stdout"
        echo "$rc" >"$result/rc"
        exit "$rc"

    # This step runs after a failed check too, and never fails. The token comes
    # from the input, and the text of the comment goes to gh api as a file, so no
    # output of docgen is part of a command line or of an expression.
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && inputs.command == 'check' && github.event_name == 'pull_request' && steps.docgen.outputs.result != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RESULT: ${{ steps.docgen.outputs.result }}
        INPUT_MARKER: ${{ inputs.marker }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set +e
        warn() {
          echo "::warning::docgen did not write the pull request comment: $1"
          exit 0
        }
        gh_failed() {
          warn "gh api failed: $(head -c 300 "$RESULT/gh.err" | tr '\n' ' ')"
        }
        if [ ! -f "$RESULT/rc" ]; then warn "docgen did not finish"; fi
        if ! command -v gh >/dev/null; then warn "gh is not on PATH"; fi
        case $INPUT_MARKER in
        '' | *[!A-Za-z0-9._-]*) warn "marker '$INPUT_MARKER' must be letters, digits, dot, dash and underscore only" ;;
        esac
        case $PR_NUMBER in
        '' | *[!0-9]*) warn "the event has no pull request number" ;;
        esac
        export GH_HOST=${GITHUB_SERVER_URL#*://}
        rc=$(cat "$RESULT/rc")
        tag="<!-- $INPUT_MARKER -->"
        body=$RESULT/body.md
        fence() {
          n=$(grep -o '```*' "$1" | awk '{ if (length > n) n = length } END { print n + 0 }')
          printf '%*s' $((n < 3 ? 3 : n + 1)) '' | tr ' ' '`'
        }
        gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" --jq ".[] | select(.body | startswith(\"$tag\")) | .id" >"$RESULT/ids" 2>"$RESULT/gh.err" || gh_failed
        id=$(head -n 1 "$RESULT/ids")
        if [ "$rc" = 0 ]; then
          if [ -z "$id" ]; then exit 0; fi
          printf '%s\n**docgen check**: the docs are current.\n' "$tag" >"$body"
        else
          # A comment holds at most 65536 characters. A limit in bytes is safe,
          # because each character is one byte or more.
          grep -v '^docgen: running ' "$RESULT/stderr" >"$RESULT/lines"
          cut=
          if [ "$(wc -c <"$RESULT/lines")" -gt 20000 ]; then
            head -c 20000 "$RESULT/lines" | sed '$d' >"$RESULT/lines.cut"
            mv "$RESULT/lines.cut" "$RESULT/lines"
            cut=1
          fi
          f=$(fence "$RESULT/lines")
          {
            printf '%s\n**docgen check** exited with code %s.\n\n%stext\n' "$tag" "$rc" "$f"
            cat "$RESULT/lines"
            printf '%s\n' "$f"
          } >"$body"
          if [ -s "$RESULT/stdout" ]; then
            f=$(fence "$RESULT/stdout")
            room=$((60000 - $(wc -c <"$body")))
            printf '\n<details><summary>Diff</summary>\n\n%sdiff\n' "$f" >>"$body"
            if [ "$(wc -c <"$RESULT/stdout")" -gt "$room" ]; then
              head -c "$room" "$RESULT/stdout" | sed '$d' >>"$body"
              cut=1
            else
              cat "$RESULT/stdout" >>"$body"
            fi
            printf '%s\n\n</details>\n' "$f" >>"$body"
          fi
          if [ -n "$cut" ]; then
            printf '\nThe result is cut to fit the size limit of a comment. The log of the job has all of it.\n' >>"$body"
          fi
          {
            printf '\n**To fix:**\n\n'
            if grep -q '^stale: ' "$RESULT/stderr"; then
              printf -- '- Run `docgen update` and commit the result.\n'
            fi
            if grep -q '^broken: ' "$RESULT/stderr"; then
              printf -- '- Fix each broken link, image or anchor.\n'
            fi
            if grep -q '^unused: ' "$RESULT/stderr"; then
              printf -- '- Remove each unused region, diagram or variable, or add a marker that uses it.\n'
            fi
            if ! grep -q '^\(stale\|broken\|unused\): ' "$RESULT/stderr"; then
              printf -- '- Fix the errors above, then run `docgen check` again.\n'
            fi
          } >>"$body"
        fi
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$id" -F "body=@$body" --silent 2>"$RESULT/gh.err" || gh_failed
          echo "Updated comment $id."
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F "body=@$body" --silent 2>"$RESULT/gh.err" || gh_failed
          echo "Posted a comment."
        fi
